/* ── App styles ── */
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif}
#map{height:100vh;width:100%}
.legend{background:white;padding:12px 16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);line-height:2;font-size:13px}
.legend h4{margin:0 0 8px;font-size:14px;font-weight:700}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:7px;vertical-align:middle}
#info-box{position:fixed;top:12px;right:12px;z-index:1000;background:white;padding:14px 18px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:260px;font-size:13px}
#info-box h3{margin:0 0 10px;font-size:15px;font-weight:700;color:#111}

.stat span{color:#555}

<body>

<div id="map"></div>

<div id="info-box">
  <h3>PNRR Studentati – Verona</h3>
  <div class="stat"><span>Interventi</span><strong>17</strong></div>
  <div class="stat"><span>Posti letto totali</span><strong>1.316</strong></div>
  <div class="stat"><span>Finanziamento PNRR</span><strong>€ 26,3 M</strong></div>
  <div class="stat"><span>Attori privati</span><strong>11 (65%)</strong></div>
  <div class="stat"><span>Fondazioni / no-profit</span><strong>5 (29%)</strong></div>
  <div class="stat"><span>Pubblico (ATER)</span><strong>1 (6%)</strong></div>
  <div class="note">Fonte: MUR, decreti DM 481/2024.<br>Le posizioni sono approssimative (comune di Verona).</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var map = L.map('map').setView([45.438, 10.991], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

var actors = [
  { soggetto:"AD VERONA S.R.L.", categoria:"privato", posti:335, fin:6688831 },
  { soggetto:"CIV S.P.A.", categoria:"privato", posti:252, fin:5031598 },
  { soggetto:"HOMA COOPERATIVA", categoria:"fondazione/no-profit", posti:120, fin:2395999 },
  { soggetto:"BRAA GLOBAL INVESTMENT S.R.L.", categoria:"privato", posti:93, fin:1856899 },
  { soggetto:"ITALHOUSING S.R.L.", categoria:"privato", posti:92, fin:1836933 },
  { soggetto:"ATER VERONA", categoria:"pubblico", posti:80, fin:1598399 },
  { soggetto:"CAMPLUS LIVING S.R.L.", categoria:"privato", posti:55, fin:1098166 },
  { soggetto:"FONDAZIONE CATTOLICA", categoria:"fondazione/no-profit", posti:50, fin:998799 },
  { soggetto:"OPERA PIA SCALABRINI", categoria:"fondazione/no-profit", posti:48, fin:958199 },
  { soggetto:"STUDENT VILLAGE VR S.R.L.", categoria:"privato", posti:45, fin:898799 },
  { soggetto:"RESIDENCE SCALIGERO S.R.L.", categoria:"privato", posti:42, fin:838399 },
  { soggetto:"ISTITUTO SALESIANO S. ZENO", categoria:"fondazione/no-profit", posti:38, fin:759199 },
  { soggetto:"ALPHA REAL ESTATE S.R.L.", categoria:"privato", posti:35, fin:698999 },
  { soggetto:"CASA DELLO STUDENTE VR SRL", categoria:"privato", posti:33, fin:659199 },
  { soggetto:"FONDAZIONE CASSA DI RISPARMIO VR", categoria:"fondazione/no-profit", posti:30, fin:599199 },
  { soggetto:"LIVING HUB VERONA S.R.L.", categoria:"privato", posti:28, fin:559199 },
  { soggetto:"ARRIVA GROUP ITALIA S.R.L.", categoria:"privato", posti:20, fin:399399 }
];

var colors = { "privato":"#c0392b", "pubblico":"#2471a3", "fondazione/no-profit":"#1e8449" };

function jitter(){ return (Math.random()-0.5)*0.03; }

function makeIcon(cat, posti){
  var c = colors[cat]||"#888";
  var r = Math.max(10, Math.min(26, 8+Math.sqrt(posti||20)*0.9));
  var d = r*2;
  return L.divIcon({
    className:'',
    html:'<svg width="'+d+'" height="'+d+'" viewBox="0 0 '+d+' '+d+'" xmlns="http://www.w3.org/2000/svg"><circle cx="'+r+'" cy="'+r+'" r="'+(r-1)+'" fill="'+c+'" fill-opacity="0.82" stroke="white" stroke-width="2"/></svg>',
    iconSize:[d,d], iconAnchor:[r,r], popupAnchor:[0,-r-4]
  });
}

function eur(n){ return '€ '+n.toLocaleString('it-IT'); }

var BASE=[45.4384,10.9916];
actors.forEach(function(a){
  var m=L.marker([BASE[0]+jitter(),BASE[1]+jitter()],{icon:makeIcon(a.categoria,a.posti)}).addTo(map);
  m.bindPopup('<strong style="font-size:13px">'+a.soggetto+'</strong><br>'+
    '<span style="color:'+colors[a.categoria]+';font-weight:600">'+a.categoria+'</span><br>'+
    'Posti letto: <strong>'+a.posti+'</strong><br>'+
    'Finanziamento PNRR: <strong>'+eur(a.fin)+'</strong>');
});

var legend=L.control({position:'bottomleft'});
legend.onAdd=function(){
  var div=L.DomUtil.create('div','legend');
  div.innerHTML='<h4>Categoria attore</h4>'+
    '<div><span class="dot" style="background:#c0392b"></span>Privato (11)</div>'+
    '<div><span class="dot" style="background:#1e8449"></span>Fondazione / no-profit (5)</div>'+
    '<div><span class="dot" style="background:#2471a3"></span>Pubblico – ATER (1)</div>'+
    '<div style="margin-top:8px;font-size:11px;color:#999">Dimensione ∝ posti letto</div>';
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
